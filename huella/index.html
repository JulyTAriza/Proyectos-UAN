<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huella · Prototipo interactivo</title>
<style>
/* =========================================================
   HUELLA · SISTEMA DE DISEÑO (tokens) — Actividad 5
   Todas las pantallas y componentes usan solo estas variables.
   ========================================================= */
@font-face{font-family:"Nunito";src:url(fonts/nunito-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
:root{
  /* Color · base */
  --c-bosque:#23302B; --c-bosque-2:#34433D; --c-crema:#FAF6EF; --c-arena:#F3ECE1; --c-superficie:#FFFFFF;
  --c-borde:#E5DCCF; --c-borde-control:#8C938F;
  --c-texto:#23302B; --c-texto-2:#5A625D; --c-texto-inv:#FAF6EF;
  /* Color · marca y acción */
  --c-primario:#B5482A; --c-primario-hover:#A8411F; --c-primario-suave:#FBE9E1; --c-acento:#D9653B; --c-acento-claro:#F2A27F;
  /* Color · estados */
  --c-exito:#2F6B4F; --c-exito-suave:#EAF3EE; --c-error:#A3271B; --c-error-suave:#FCEBE8;
  --c-aviso:#7A4E00; --c-aviso-suave:#FDF1D6; --c-info:#235380; --c-info-suave:#E8F0F8;
  --c-foco:#235380;
  /* Tipografía */
  --f-display:"Nunito", system-ui, sans-serif;
  --f-texto:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* Espaciado (base 4 px) */
  --s-1:.25rem; --s-2:.5rem; --s-3:.75rem; --s-4:1rem; --s-5:1.5rem; --s-6:2rem; --s-7:3rem;
  /* Forma */
  --r-sm:8px; --r-md:12px; --r-lg:12px; --r-pill:999px;
  --sh-1:none;
  --sh-2:0 4px 16px rgba(35,48,43,.18);
  --toque:44px; /* objetivo táctil mínimo */
  /* Color · variantes de neutros (estados de componentes) */
  --c-desh-fondo:#E7E2DA; --c-desh-texto:#6B736E; --c-lleno-fondo:#F4F1EC; --c-lleno-borde:#A39C90; --c-lleno-texto:#4F5752;
  --c-skel-1:#EFE8DD; --c-skel-2:#F7F2EA; --c-error-campo:#FFFBFA; --c-lateral-texto:#E9E3D9; --c-lateral-pie:#C9C4BA; --c-blanco:#FFFFFF;
}
html{font-size:100%}
html.texto-grande{font-size:115%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--c-crema);color:var(--c-texto);font-family:var(--f-texto);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--c-primario);font-weight:700}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0}
.t-display{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.1}
h1,.t-h1{font-size:1.5rem;line-height:1.25}
h2,.t-h2{font-size:1.125rem;line-height:1.3}
h3,.t-h3{font-size:1.0625rem;line-height:1.35}
p{margin:0}
.t-small{font-size:.875rem;line-height:1.45}
.t-muted{color:var(--c-texto-2)}
.t-overline{font-size:.875rem;font-weight:700;color:var(--c-texto-2)}
.t-label{font-weight:700;font-size:.9375rem}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:3px solid var(--c-foco);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:var(--s-4);top:-60px;background:var(--c-bosque);color:var(--c-texto-inv);padding:var(--s-3) var(--s-4);border-radius:var(--r-md);z-index:100;text-decoration:none}
.skip:focus{top:var(--s-3)}
.stack>*+*{margin-top:var(--s-4)}
.stack-sm>*+*{margin-top:var(--s-2)}
.stack-lg>*+*{margin-top:var(--s-5)}
.row{display:flex;gap:var(--s-3);align-items:center}
.wrap{flex-wrap:wrap}
.ic{flex:none}

/* ============ COMPONENTE: Botón ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:48px;padding:0 var(--s-5);border-radius:var(--r-md);border:2px solid transparent;font-weight:800;font-size:1rem;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primario{background:var(--c-primario);color:var(--c-blanco)}
.btn-primario:hover{background:var(--c-primario-hover)}
.btn-secundario{background:var(--c-superficie);color:var(--c-bosque);border-color:var(--c-bosque)}
.btn-secundario:hover{background:var(--c-arena)}
.btn-texto{background:transparent;color:var(--c-primario);padding:0 var(--s-3);min-height:var(--toque)}
.btn-texto:hover{text-decoration:underline}
.btn-peligro{background:var(--c-error);color:var(--c-blanco)}
.btn[aria-busy="true"]{pointer-events:none;cursor:progress}
.btn[disabled]{background:var(--c-desh-fondo);color:var(--c-desh-texto);border-color:transparent;cursor:not-allowed}
.btn-bloque{width:100%}
.btn-sm{min-height:40px;padding:0 var(--s-4);font-size:.9375rem}
.cargando{display:flex;gap:12px;align-items:center;padding:40px 0;color:var(--c-texto-2);font-weight:700}
.spinner.oscuro{width:28px;height:28px;border-color:var(--c-borde);border-top-color:var(--c-bosque)}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:var(--c-blanco);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;min-width:var(--toque);min-height:var(--toque);border-radius:var(--r-pill);border:0;background:transparent;cursor:pointer;color:var(--c-bosque)}
.icon-btn:hover{background:var(--c-arena)}
.btn-ayuda{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:var(--r-pill);background:var(--c-bosque);color:var(--c-texto-inv);border:0;font-weight:800;font-size:.9375rem;cursor:pointer}
.btn-ayuda:hover{background:var(--c-bosque-2)}

/* ============ COMPONENTE: Campo de texto ============ */
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-weight:700}
.campo .ayuda{font-size:.875rem;color:var(--c-texto-2)}
.input{min-height:48px;padding:0 var(--s-4);border:2px solid var(--c-borde-control);border-radius:var(--r-md);background:var(--c-superficie);font-size:1rem}
.input:hover{border-color:var(--c-texto-2)}
.input:focus-visible{outline:3px solid var(--c-foco);outline-offset:1px;border-color:var(--c-foco);border-radius:var(--r-md)}
.input[aria-invalid="true"]{border-color:var(--c-error);background:var(--c-error-campo)}
.msg-error{display:flex;gap:6px;align-items:flex-start;color:var(--c-error);font-size:.875rem;font-weight:700}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;font-weight:700;margin-bottom:var(--s-2)}

/* ============ COMPONENTE: Chip / etiqueta ============ */
.chips{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.chip-sel{position:relative}
.chip-sel input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip-sel span{display:inline-flex;align-items:center;gap:6px;min-height:var(--toque);padding:0 var(--s-4);border-radius:var(--r-pill);border:2px solid var(--c-borde-control);background:var(--c-superficie);font-weight:700;font-size:.9375rem}
.chip-sel input:checked+span{background:var(--c-bosque);border-color:var(--c-bosque);color:var(--c-texto-inv)}
.chip-sel input:focus-visible+span{outline:3px solid var(--c-foco);outline-offset:2px}
.chip-sel .chk{display:none}
.chip-sel input:checked+span .chk{display:block}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r-pill);background:var(--c-arena);font-size:.8125rem;font-weight:700;color:var(--c-bosque)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r-pill);font-size:.8125rem;font-weight:800}
.badge-exito{background:var(--c-exito-suave);color:var(--c-exito)}
.badge-aviso{background:var(--c-aviso-suave);color:var(--c-aviso)}
.badge-info{background:var(--c-info-suave);color:var(--c-info)}
.filtro{min-height:var(--toque);padding:0 var(--s-4);border-radius:var(--r-pill);border:2px solid var(--c-borde-control);background:var(--c-superficie);font-weight:700;cursor:pointer}
.filtro[aria-pressed="true"]{background:var(--c-bosque);color:var(--c-texto-inv);border-color:var(--c-bosque)}

/* ============ COMPONENTE: Tarjeta ============ */
.card{background:var(--c-superficie);border:1px solid var(--c-borde);border-radius:var(--r-lg);padding:var(--s-5);box-shadow:var(--sh-1)}
.card-plana{background:var(--c-superficie);border:1px solid var(--c-borde);border-radius:var(--r-lg);padding:var(--s-4)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s-3);margin-bottom:var(--s-3)}
.animal-card{display:flex;gap:var(--s-4);align-items:center;text-align:left;width:100%;background:var(--c-superficie);border:1px solid var(--c-borde);border-radius:var(--r-lg);padding:var(--s-4);box-shadow:var(--sh-1);cursor:pointer;text-decoration:none;color:inherit}
.animal-card:hover{border-color:var(--c-borde-control)}
.animal-card .nombre{font-family:var(--f-display);font-weight:800;font-size:1.125rem}
.avatar{border-radius:50%;overflow:hidden;flex:none}
.encuentro{display:grid;grid-template-columns:auto 1fr;gap:var(--s-4);align-items:center}
.dato{display:flex;gap:8px;align-items:center;color:var(--c-texto-2);font-size:.9375rem}

/* ============ COMPONENTE: Mensaje de estado ============ */
.alerta{display:flex;gap:var(--s-3);padding:var(--s-4);border-radius:var(--r-md);border-left:5px solid;font-size:.9375rem}
.alerta strong{display:block}
.alerta-info{background:var(--c-info-suave);color:var(--c-info);border-color:var(--c-info)}
.alerta-exito{background:var(--c-exito-suave);color:var(--c-exito);border-color:var(--c-exito)}
.alerta-error{background:var(--c-error-suave);color:var(--c-error);border-color:var(--c-error)}
.alerta-aviso{background:var(--c-aviso-suave);color:var(--c-aviso);border-color:var(--c-aviso)}
.alerta p{color:var(--c-texto)}
.vacio{text-align:center;padding:var(--s-6) var(--s-4);border:2px dashed var(--c-borde);border-radius:var(--r-lg);background:rgba(255,255,255,.5)}
.vacio .ilus{display:flex;justify-content:center;margin:0 0 var(--s-3);color:var(--c-acento)}
.skel{background:linear-gradient(90deg,var(--c-skel-1) 25%,var(--c-skel-2) 50%,var(--c-skel-1) 75%);background-size:200% 100%;animation:brillo 1.2s infinite;border-radius:var(--r-md)}
@keyframes brillo{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--c-bosque);color:var(--c-texto-inv);padding:var(--s-3) var(--s-5);border-radius:var(--r-md);box-shadow:var(--sh-2);font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s,visibility .25s;visibility:hidden;z-index:60;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast.ver{opacity:1;visibility:visible;transform:translateX(-50%)}
body.en-flujo .toast{bottom:auto;top:76px;transform:translateX(-50%) translateY(-20px)}
body.en-flujo .toast.ver{transform:translateX(-50%)}

/* ============ COMPONENTE: Selector de ánimo ============ */
.animo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;overflow-wrap:anywhere}
.animo label,.animo .animo-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:var(--s-3) 2px;border:2px solid var(--c-borde);border-radius:var(--r-md);background:var(--c-superficie);cursor:pointer;text-align:center;font-weight:700;font-size:.75rem;line-height:1.2;min-height:92px}
.animo input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.animo .num{font-family:var(--f-display);font-size:1rem}
.animo .animo-btn:hover{border-color:var(--c-bosque)}
.animo label:has(input:checked){border-color:var(--c-bosque);background:var(--c-bosque);color:var(--c-texto-inv)}
.animo label:has(input:focus-visible){outline:3px solid var(--c-foco);outline-offset:2px}

/* ============ COMPONENTE: Franja horaria ============ */
.franjas{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s-2)}
.franja{position:relative}
.franja input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.franja .caja,.franja-llena{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;width:100%;min-height:64px;padding:var(--s-2) var(--s-4);border:2px solid var(--c-borde-control);border-radius:var(--r-md);background:var(--c-superficie);text-align:left;cursor:pointer}
.franja .hora,.franja-llena .hora{font-family:var(--f-display);font-weight:800;font-size:1.125rem}
.franja .cupo{font-size:.8125rem;font-weight:700;color:var(--c-exito)}
.franja .cupo.ultimo{color:var(--c-aviso)}
.franja input:checked+.caja{border-color:var(--c-primario);background:var(--c-primario-suave);box-shadow:inset 0 0 0 1px var(--c-primario)}
.franja input:checked+.caja .hora::after{content:" ✓"}
.franja input:focus-visible+.caja{outline:3px solid var(--c-foco);outline-offset:2px}
.franja-llena{border-style:dashed;border-color:var(--c-lleno-borde);background:var(--c-lleno-fondo);color:var(--c-lleno-texto)}
.franja-llena .hora{text-decoration:line-through}
.franja-llena .cupo{font-size:.8125rem;font-weight:700}
.dias{display:flex;gap:var(--s-2);overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.dia{position:relative;flex:none}
.dia input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.dia>span{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:72px;min-height:72px;padding:6px 8px;border:2px solid var(--c-borde-control);border-radius:var(--r-md);background:var(--c-superficie);font-weight:700;font-size:.8125rem;line-height:1.2}
.dia>span b{font-family:var(--f-display);font-size:1.375rem;font-weight:800}
.dia input:checked+span{background:var(--c-bosque);color:var(--c-texto-inv);border-color:var(--c-bosque)}
.dia input:focus-visible+span{outline:3px solid var(--c-foco);outline-offset:2px}
.dia .lleno{font-size:.75rem;font-weight:800;color:var(--c-error)}
.dia input:checked+span .lleno{color:var(--c-acento-claro)}

/* ============ COMPONENTE: Indicador de pasos ============ */
.pasos{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.pasos .txt{font-weight:800;font-size:.875rem}
.pasos ol{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;list-style:none;margin:0;padding:0}
.pasos li{height:6px;border-radius:3px;background:var(--c-borde)}
.pasos li.hecho{background:var(--c-bosque)}
.pasos li.actual{background:var(--c-primario)}

/* ============ COMPONENTE: Interruptor ============ */
.switch{display:flex;justify-content:space-between;align-items:center;gap:var(--s-4);min-height:var(--toque);cursor:pointer}
.switch input{appearance:none;width:52px;height:30px;border-radius:15px;background:var(--c-borde-control);position:relative;flex:none;cursor:pointer;margin:0;transition:.2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--c-blanco);transition:.2s}
.switch input:checked{background:var(--c-exito)}
.switch input:checked::after{left:25px}
.switch input:disabled{opacity:.7;cursor:not-allowed}
.check{display:flex;gap:var(--s-3);align-items:flex-start;cursor:pointer;min-height:var(--toque);padding-top:10px}
.check input{width:24px;height:24px;accent-color:var(--c-bosque);flex:none;margin:0}

/* ============ ESTRUCTURA: app, encabezado, navegación ============ */
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,246,239,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--c-borde)}
.topbar-in{display:flex;align-items:center;gap:var(--s-3);min-height:64px;padding:var(--s-2) var(--s-4);max-width:1120px;margin:0 auto}
.topbar .titulo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:1.125rem;text-align:center}
.avatar-btn{width:var(--toque);height:var(--toque);border-radius:50%;border:2px solid var(--c-borde);background:var(--c-arena);font-family:var(--f-display);font-weight:800;font-size:1.125rem;cursor:pointer;color:var(--c-bosque);flex:none}
main{display:block;max-width:1120px;margin:0 auto;padding:var(--s-5) var(--s-4) 120px}
main:focus{outline:none}
h1[tabindex="-1"]:focus,.alerta[tabindex="-1"]:focus,#conf-alerta:focus{outline:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--c-superficie);border-top:1px solid var(--c-borde);box-shadow:0 -4px 16px rgba(35,48,43,.06)}
.tabbar ul{display:grid;grid-template-columns:repeat(5,1fr);list-style:none;margin:0 auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));max-width:560px;align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;font-size:.75rem;font-weight:700;color:var(--c-texto-2);text-decoration:none;border-radius:var(--r-md)}
.tab[aria-current="page"]{color:var(--c-primario)}
.tab[aria-current="page"] .lbl{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.tab-match{margin-top:-26px}
.tab-match .fab{width:56px;height:56px;border-radius:50%;background:var(--c-primario);color:var(--c-blanco);display:flex;align-items:center;justify-content:center;border:4px solid var(--c-superficie)}
.tab-match{color:var(--c-primario)}
.sidebar{display:none}
.flow-actions{position:sticky;bottom:0;z-index:15;margin:var(--s-5) calc(-1 * var(--s-4)) 0;padding:var(--s-3) var(--s-4) calc(var(--s-3) + env(safe-area-inset-bottom));background:rgba(250,246,239,.97);border-top:1px solid var(--c-borde);display:flex;gap:var(--s-3)}
.flow-actions .btn{flex:1}
.flow-actions{flex-wrap:wrap}
.pendiente{flex-basis:100%;display:flex;gap:6px;align-items:center;color:var(--c-aviso);font-weight:700;font-size:.875rem;margin:0}
body.en-flujo .tabbar{display:none}
body:not(.en-flujo):not(.sin-nav) .flow-actions{bottom:72px}
body.en-flujo main{padding-bottom:var(--s-4)}
body.sin-nav .tabbar{display:none}
body.sin-nav main{padding-bottom:var(--s-6)}

/* Hero del animal */
.hero-animal{position:relative;border-radius:var(--r-lg);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:var(--s-4);min-height:180px;border:1px solid var(--c-borde)}
.hero-animal .verif{position:absolute;left:var(--s-3);top:var(--s-3)}
.grid-2{display:grid;gap:var(--s-4)}
.grid-2>*,.flujo-wrap,.estrecho{min-width:0}
.grid-cards{display:grid;gap:var(--s-3)}
.mini-barras{display:flex;align-items:flex-end;gap:6px;height:56px}
.mini-barras i{flex:1;border:2px dashed var(--c-borde);border-bottom:0;border-radius:6px 6px 0 0}
.lineas a{word-break:break-word}

/* Diálogo / hoja */
dialog{border:0;padding:0;border-radius:var(--r-lg);max-width:560px;width:calc(100% - 24px);max-height:88vh;box-shadow:var(--sh-2);background:var(--c-superficie);color:var(--c-texto)}
dialog::backdrop{background:rgba(35,48,43,.55)}
.dlg-head{position:sticky;top:0;background:var(--c-superficie);display:flex;justify-content:space-between;align-items:center;gap:var(--s-3);padding:var(--s-4) var(--s-4) var(--s-3) var(--s-5);border-bottom:1px solid var(--c-borde);z-index:1}
.dlg-body{padding:var(--s-5)}

/* Panel del prototipo (no es parte del producto) */
.proto-btn{position:fixed;right:12px;bottom:90px;z-index:40;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:var(--r-pill);border:2px dashed var(--c-desh-texto);background:var(--c-blanco);color:#3F4743;font-weight:800;font-size:.8125rem;cursor:pointer;box-shadow:var(--sh-1)}

.proto-panel .switch{border-bottom:1px solid var(--c-borde);padding:6px 0}

/* Bienvenida */
.bienvenida{max-width:520px;margin:0 auto;padding-top:var(--s-4)}
.hero-bienvenida{background:var(--c-superficie);border:1px solid var(--c-borde);border-radius:var(--r-lg);padding:var(--s-5)}

.hero-bienvenida .paws{margin:12px -10px -30px auto;opacity:.9}
.hero-bienvenida .marca{font-family:var(--f-display);font-weight:800;font-size:2.25rem;line-height:1;color:var(--c-primario)}
.beneficios{list-style:none;padding:0;margin:0}
.beneficios li{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-2) 0}
.beneficios .ic{color:var(--c-exito)}

/* ============ RESPONSIVE ============ */
@media (min-width:min(640px,100%)){

}
@media (min-width:1024px){

  .sidebar .logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.5rem;padding:0 var(--s-2) var(--s-4);color:var(--c-primario);text-decoration:none}

  .flow-actions{position:static;background:transparent;border:0;margin:var(--s-6) 0 0;padding:0;justify-content:flex-end}

  .flujo-wrap{max-width:960px}

  .hero-bienvenida{padding:var(--s-6)}
  .hero-bienvenida .marca{font-size:2.75rem}
  .hero-bienvenida .paws{position:absolute;right:0;bottom:0;margin:0}

const DS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'], MS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function dias(){const r=[],h=new Date();for(let i=1;i<=7;i++){const d=new Date(h.getFullYear(),h.getMonth(),h.getDate()+i);r.push({i,d,corto:DS[d.getDay()],num:d.getDate(),mes:MS[d.getMonth()],largo:`${DL[d.getDay()]} ${d.getDate()} de ${MS[d.getMonth()]}`})}return r}
const HORAS=['9:00 a. m.','10:30 a. m.','3:00 p. m.','4:30 p. m.'];
function cupos(dia,animal){ if(dia.d.getDay()===6) return [0,0,0,0];
 const seed=(dia.i*7+animal.id.length*3)%5, base=[[3,1,0,2],[2,0,3,1],[0,2,1,3],[1,3,2,0],[3,0,2,2]];return base[seed]; }
function alternativas(animal,excluirDia){const out=[];for(const d of dias()){const c=cupos(d,animal);c.forEach((n,h)=>{if(n>0&&out.length<3&&!(d.i===excluirDia&&false))out.push({dia:d.i,hora:h,n,d})});if(out.length>=3)break}return out}

const ESTADO0=()=>({usuario:{nombre:'Laura',correo:'laura@correo.com',especie:'ambos',tamanos:['pequeño','mediano']},
 checkin:{animo:null,causas:[]},cola:[],idx:0,animal:null,origen:'match',reserva:{dia:null,hora:null},guiaLeida:false,recordatorio:true,
 reservas:[],favoritos:[],textoGrande:false,
 demo:{primerEncuentro:true,falloRed:false,sinAnimales:false},falloUsado:false});
let S=ESTADO0();
try{const g=sessionStorage.getItem('huella');if(g)S=Object.assign(ESTADO0(),JSON.parse(g))}catch(e){}
const guardar=()=>{try{sessionStorage.setItem('huella',JSON.stringify(S))}catch(e){}};

/* Algoritmo de match: filtra por preferencias y ordena por cercanía al ánimo y a las causas */
function calcularMatch(){
 const m=S.checkin.animo||3, objetivo=m<=2?1:m===3?2:3, causas=S.checkin.causas, u=S.usuario;
 return ANIMALES.filter(a=>(u.especie==='ambos'||a.especie===u.especie)&&u.tamanos.includes(a.tamano))
  .map(a=>{let p=-Math.abs(a.energia-objetivo)*2;if(causas.includes('Soledad')&&a.sociable)p+=1.5;if(causas.includes('Sueño')&&a.energia===1)p+=1;return{a,p}})
  .sort((x,y)=>y.p-x.p).map(x=>x.a.id);
}
function razones(a){
 const m=S.checkin.animo||3, r=[], c=S.checkin.causas, N=a.nombre;
 if(m<=2) r.push(`Hoy marcaste «${ANIMOS[m-1]}». ${N} es de energía baja: el plan es ${a.especie==='gato'?'acompañar'+lo(a)+' sin prisa':'caminar despacio'}, sin exigencias.`);
 else if(m===3) r.push(`Con un día «Regular», un plan suave pero activo ayuda a despejarse. ${N} va a tu ritmo.`);
 else r.push(`Tienes buena energía hoy y ${N} también: ${a.energia>=3?'le encanta correr y jugar':'disfruta un paseo largo'}.`);
 if(c.includes('Soledad')) r.push(a.sociable?`Mencionaste soledad: ${N} es muy ${a.sexo==='f'?'sociable y cariñosa':'sociable y cariñoso'}, y hay voluntarios acompañando.`:`Mencionaste soledad: también puedes unirte a un paseo en manada con otras personas.`);
 if(c.includes('Sueño')) r.push('Dormiste poco: el encuentro dura 45 minutos y no necesitas preparar nada.');
 if(c.includes('Parciales o estudio')||c.includes('Trabajo')) r.push('Para despejarte de las entregas: 45 minutos al aire libre y sin pantallas.');
 if(c.includes('Dinero')) r.push('El encuentro es gratuito.');
 if(!S.usuario.tamanos.includes('grande')&&a.especie==='perro') r.push(`Es de tamaño ${a.tamano}: no te sugerimos perros grandes, como indicaste.`);
 r.push(`Está a ${String(a.km).replace('.',',')} km, en ${a.refugio} (${a.barrio}).`);
 return r.slice(0,3);
}

 tarjetaEncuentro:(r,acciones=true,nivel=2)=>{const a=byId(r.animal),d=dias().find(x=>x.i===r.dia)||dias()[0];

   ${acciones?`<div class="row wrap" style="margin-top:16px;gap:8px">${C.boton('Reprogramar',{tipo:'secundario',icono:'refresh',sm:true,attrs:`data-reprogramar="${r.id}"`})}${C.boton('Cancelar reserva',{tipo:'texto',attrs:`data-cancelar="${r.id}"`})}</div>`:''}</article>`}
};

    :`<div class="franjas">${c.map((n,h)=>n>0?`<label class="franja"><input type="radio" name="hora" value="${h}" ${S.reserva.hora===h?'checked':''}><span class="caja"><span class="hora">${HORAS[h]}</span><span class="cupo ${n===1?'ultimo':''}">${n===1?'Último cupo':n+' cupos'}</span></span></label>`
      :`<button type="button" class="franja-llena" data-llena="${h}" aria-label="${HORAS[h]}, sin cupo. Ver alternativas"><span class="hora">${HORAS[h]}</span><span class="cupo">Sin cupo</span></button>`).join('')}</div>`;
   document.getElementById('h-alt').innerHTML='';resumen();};
  const resumen=()=>{const d=ds.find(x=>x.i===S.reserva.dia);document.getElementById('resumen-h').innerHTML=`<p class="dato">${ic('calendar',18)}<span style="text-transform:capitalize">${d.largo}</span></p><p class="dato">${ic('clock',18)}${S.reserva.hora!=null?HORAS[S.reserva.hora]:'<em>Elige una hora</em>'}</p><p class="dato">${ic('pin',18)}${a.barrio} · entrada principal del refugio</p>`};
  f.addEventListener('change',e=>{if(e.target.name==='dia'){S.reserva={dia:+e.target.value,hora:null};pintar()}if(e.target.name==='hora'){S.reserva.hora=+e.target.value;document.getElementById('h-err').innerHTML='';resumen()}guardar()});
  document.getElementById('horario-wrap').addEventListener('click',e=>{const b=e.target.closest('[data-llena]');if(b){document.getElementById('h-alt').innerHTML=C.alerta('aviso',`Las ${HORAS[+b.dataset.llena]} ya están llenas`,'No te preocupes, estas franjas sí tienen cupo:',altHTML(a,S.reserva.dia,+b.dataset.llena));document.querySelector('#h-alt .alerta').setAttribute('tabindex','-1');document.querySelector('#h-alt .alerta').focus()}
   const al=e.target.closest('[data-alt]');if(al){const[di,h]=al.dataset.alt.split('-').map(Number);S.reserva={dia:di,hora:h};guardar();f.querySelector(`[name=dia][value="${di}"]`).checked=true;pintar();const r=f.querySelector(`[name=hora][value="${h}"]`);r.checked=true;r.focus();resumen();anunciar('Franja seleccionada: '+HORAS[h])}});

function altHTML(a,dia,horaLlena){const alts=[];for(const d of dias())cupos(d,a).forEach((n,h)=>{if(n>0)alts.push({d,h,n,dist:Math.abs(d.i-dia)*10+Math.abs(h-(horaLlena??h))})});alts.sort((x,y)=>x.dist-y.dist||x.d.i-y.d.i);alts.splice(3);alts.sort((x,y)=>x.d.i-y.d.i||x.h-y.h);

function confirmarReserva(){
 const btn=document.getElementById('c-confirmar'),g=document.getElementById('c-guia');
 if(S.demo.primerEncuentro&&g&&!g.checked){g.setAttribute('aria-invalid','true');document.getElementById('c-guia-err').innerHTML=`<p class="msg-error" role="alert">${ic('alert',18)}Lee la guía y marca la casilla antes de confirmar: así sabrás qué esperar.</p>`;g.focus();return}
 btn.setAttribute('aria-busy','true');btn.innerHTML='<span class="spinner" aria-hidden="true"></span><span>Confirmando…</span>';anunciar('Confirmando tu reserva');
 document.getElementById('conf-alerta').innerHTML='';
 const t=++token;
 setTimeout(()=>{if(t!==token)return;
  if(S.demo.falloRed&&!S.falloUsado){S.falloUsado=true;guardar();
   btn.removeAttribute('aria-busy');btn.innerHTML=`${ic('refresh',20)}<span>Reintentar</span>`;
   const al=document.getElementById('conf-alerta');al.innerHTML=C.alerta('error','No pudimos confirmar tu reserva','Parece que se perdió la conexión. Tu horario queda apartado 10 minutos: revisa tu internet y toca «Reintentar».')+'<div style="height:16px"></div>';al.focus();return}
  const a=byId(S.animal),id='r'+Date.now();
  if(S.reprogramando){S.reservas=S.reservas.filter(r=>r.id!==S.reprogramando);S.reprogramando=null}
  S.reservas.unshift({id,animal:a.id,dia:S.reserva.dia,hora:S.reserva.hora,tipo:TIPO(a)});S.ultima=id;S.demo.primerEncuentro=false;S.falloUsado=false;guardar();ir('listo');
 },1200);
}

 </section>

  f.addEventListener('submit',e=>{e.preventDefault();const t=[...f.querySelectorAll('[name=tamano]:checked')].map(x=>x.value);
   if(!t.length){toast('Elige al menos un tamaño','alert');f.querySelector('[name=tamano]').focus();return}
   S.usuario.nombre=document.getElementById('p-nombre').value.trim()||S.usuario.nombre;S.usuario.especie=f.especie.value;S.usuario.tamanos=t;S.recordatorio=document.getElementById('p-rec').checked;S.cola=[];guardar();cabecera({titulo:'Perfil'});toast('Preferencias guardadas','check')});
 }});

const dlg=document.getElementById('dlg');
function abrirDialogo(titulo,cuerpo,pie='',clase=''){
 dlg.className=clase;
 dlg.innerHTML=`<div class="dlg-head"><h2 id="dlg-title">${titulo}</h2><button type="button" class="icon-btn" data-cerrar aria-label="Cerrar">${ic('close',24)}</button></div><div class="dlg-body">${cuerpo}</div>${pie?`<div class="dlg-foot">${pie}</div>`:''}`;
 dlg.showModal();
}
dlg.addEventListener('click',e=>{if(e.target===dlg||e.target.closest('[data-cerrar]'))dlg.close()});
function ayuda(){abrirDialogo('Ayuda',`<div class="stack-lg"><div><h3 style="margin-bottom:8px">¿Necesitas hablar con alguien?</h3>${lineasApoyo()}</div>
 <div class="stack-sm"><h3>¿Cómo funciona Huella?</h3><ol style="margin:0;padding-left:20px" class="stack-sm"><li>Cuentas cómo te sientes (menos de un minuto).</li><li>Te sugerimos un animal compatible y te explicamos por qué.</li><li>Reservas un paseo o una visita con cupo disponible.</li><li>Después del encuentro ves tu antes y después.</li></ol></div>
 <div class="stack-sm"><h3>Tu privacidad</h3><p class="t-muted">Tu ánimo solo lo ves tú. Los refugios ven tu nombre y la reserva.</p></div>
 <p class="t-small t-muted">Huella no reemplaza la atención psicológica.</p></div>`)}
function guia(){const a=byId(S.animal)||byId('toby'),gato=a.especie==='gato';
 const items=gato?[['Qué llevar','Nada especial. El refugio te recibe y te presenta a '+a.nombre+'.'],['Cómo saludar','Siéntate a su altura y deja que se acerque. Ofrece la mano para que la huela antes de acariciar.'],['Si se esconde o bufa','Es normal al inicio. Dale espacio y háblale suave; el voluntario te orienta.'],['Al terminar','Te preguntaremos cómo te sientes (10 segundos) para tu antes y después.']]
  :[['Qué llevar','Ropa cómoda y agua. El refugio te presta la correa, el arnés y las bolsas.'],['Cómo saludar','Deja que te huela primero y acaricia el lomo. Evita abrazarlo al inicio.'],['Si se pone nervioso','Detente, habla suave y avisa al voluntario. Nunca sueltes la correa.'],['Al terminar','Te preguntaremos cómo te sientes (10 segundos) para tu antes y después.']];
 abrirDialogo(GUIA(a),`<div class="stack-lg">${items.map(([t,d],i)=>`<div class="guia-item"><span class="n" aria-hidden="true">${i+1}</span><div><h3>${t}</h3><p class="t-muted">${d}</p></div></div>`).join('')}
  ${C.alerta('info','Siempre te acompaña un voluntario','Si algo te incomoda puedes terminar el encuentro cuando quieras.')}</div>`,
  C.boton('Entendido',{icono:'check',attrs:'data-guia-ok'}));}
function pedirCita(){abrirDialogo('Pedir una cita',`<form id="f-cita" class="stack-lg" novalidate><p>Elige con quién quieres hablar. Te escribiremos al correo para acordar la hora.</p>
 <fieldset><legend>Profesional</legend><div class="stack-sm">${['Bienestar universitario de mi universidad','Psicólogo/a aliado de Huella (primera cita sin costo)'].map((x,i)=>`<label class="check" style="padding-top:0"><input type="radio" name="pro" value="${i}" ${i===0?'checked':''}><span>${x}</span></label>`).join('')}</div></fieldset></form>`,
 C.boton('Cancelar',{tipo:'secundario',attrs:'data-cerrar'})+C.boton('Enviar solicitud',{icono:'check',attrs:'data-cita-ok'}))}
function cancelar(id){const r=S.reservas.find(x=>x.id===id),a=byId(r.animal);
 abrirDialogo(`¿Cancelar ${r.tipo==='visita'?'la visita':'el paseo'} con ${a.nombre}?`,`<p>Liberaremos el cupo para otra persona. Puedes volver a reservar cuando quieras.</p>`,
  C.boton('Mantener reserva',{tipo:'secundario',attrs:'data-cerrar'})+C.boton('Sí, cancelar',{tipo:'peligro',icono:'trash',attrs:`data-cancelar-ok="${id}"`}))}
function controles(){
 abrirDialogo('Controles del prototipo',`<div class="stack-lg proto-panel">${C.alerta('aviso','No forman parte del producto','Sirven para revisar los estados de interfaz en el prototipo sin backend.')}
 <div><h3 style="margin-bottom:4px">Escenarios</h3>
  <label class="switch"><span><strong>Primer encuentro</strong><br><span class="t-small t-muted">La guía es obligatoria antes de confirmar.</span></span><input type="checkbox" role="switch" data-demo="primerEncuentro" ${S.demo.primerEncuentro?'checked':''}></label>
  <label class="switch"><span><strong>Fallo de conexión al confirmar</strong><br><span class="t-small t-muted">El primer intento de confirmar falla (estado de error).</span></span><input type="checkbox" role="switch" data-demo="falloRed" ${S.demo.falloRed?'checked':''}></label>
  <label class="switch"><span><strong>Sin animales disponibles</strong><br><span class="t-small t-muted">El match muestra el estado vacío.</span></span><input type="checkbox" role="switch" data-demo="sinAnimales" ${S.demo.sinAnimales?'checked':''}></label></div>
 <div><h3 style="margin-bottom:8px">Ir a</h3><div class="row wrap" style="gap:8px">${[['proyecto','Proyecto'],['bienvenida','Bienvenida'],['inicio','Inicio'],['movil','Vista celular'],['tablero','Tablero de mockups'],['sistema','Sistema de diseño']].map(([r,l])=>`<a class="btn btn-secundario btn-sm" href="#${r}" data-cerrar>${l}</a>`).join('')}</div></div>
 </div>`,C.boton('Reiniciar prototipo',{tipo:'texto',icono:'refresh',attrs:'data-reset'})+C.boton('Listo',{attrs:'data-cerrar'}));
}
document.getElementById('proto-btn').addEventListener('click',controles);
dlg.addEventListener('change',e=>{const k=e.target.dataset.demo;if(k){S.demo[k]=e.target.checked;if(k==='falloRed')S.falloUsado=false;guardar();anunciar('Escenario actualizado')}});
dlg.addEventListener('click',e=>{
 if(e.target.closest('[data-guia-ok]')){S.guiaLeida=true;guardar();dlg.close();const g=document.getElementById('c-guia');if(g){g.checked=true;const pe=document.getElementById('pendiente');if(pe)pe.hidden=true;g.removeAttribute('aria-invalid');document.getElementById('c-guia-err').innerHTML='';g.focus()}anunciar('Guía leída')}
 if(e.target.closest('[data-cita-ok]')){dlg.close();toast('Solicitud enviada. Te escribiremos en menos de 24 horas.','check')}
 const c=e.target.closest('[data-cancelar-ok]');if(c){S.reservas=S.reservas.filter(r=>r.id!==c.dataset.cancelarOk);guardar();dlg.close();toast('Reserva cancelada. El cupo quedó libre.','check');render()}
 if(e.target.closest('[data-reset]')){const d=S.demo;S=ESTADO0();guardar();aplicarTexto();dlg.close();toast('Prototipo reiniciado','refresh');ir('bienvenida')}
});

function toast(m,i='check'){const t=document.getElementById('toast');t.innerHTML=ic(i,20)+`<span>${m}</span>`;t.classList.add('ver');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('ver'),3200)}
function anunciar(m){const a=document.getElementById('anuncio');a.textContent='';setTimeout(()=>a.textContent=m,50)}
function enfocarTitulo(){const h=document.querySelector('#main h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:false})}}
function aplicarTexto(){document.documentElement.classList.toggle('texto-grande',!!S.textoGrande)}
const ruta=()=>(location.hash||'#proyecto').slice(1).split('?')[0]||'proyecto';
function ir(r){if(ruta()===r)render();else location.hash=r}
const ATRAS={checkin:'inicio',apoyo:'checkin',match:'checkin',horario:()=>S.origen==='match'?'match':'animal',confirmar:'horario',registro:'bienvenida',animal:'explorar',listo:'inicio'};

document.addEventListener('click',e=>{
 const t=e.target;
 const irA=t.closest('[data-ir]');if(irA&&!irA.closest('form#f-registro button[type=submit]')){ir(irA.dataset.ir);return}
 if(t.closest('[data-ayuda]'))return ayuda();
 if(t.closest('[data-atras]')){let a=ATRAS[ruta()];if(typeof a==='function')a=a();ir(a||'inicio');return}
 if(t.closest('[data-otro]')){S.idx++;guardar();pintarMatch();return}
 if(t.closest('[data-reiniciar-cola]')){S.idx=0;guardar();pintarMatch();return}
 if(t.closest('[data-avisar]'))return toast('Listo: te avisaremos cuando haya cupos.','bell');
 if(t.closest('[data-guia]'))return guia();
 if(t.closest('[data-cita]'))return pedirCita();
 const ver=t.closest('[data-ver]');if(ver){S.ver=ver.dataset.ver;guardar();ir('animal');return}
 const fil=t.closest('[data-filtro]');if(fil){S.filtro=fil.dataset.filtro;guardar();render(false);document.querySelector(`[data-filtro="${S.filtro}"]`).focus();return}
 const fav=t.closest('[data-fav]');if(fav){const id=fav.dataset.fav;S.favoritos=S.favoritos.includes(id)?S.favoritos.filter(x=>x!==id):[...S.favoritos,id];guardar();toast(S.favoritos.includes(id)?`${byId(id).nombre} está en tus favoritos`:'Quitado de favoritos','heart');render(false);document.querySelector('[data-fav]').focus();return}
 const res=t.closest('[data-reservar]');if(res){S.animal=res.dataset.reservar;S.origen='explorar';S.reserva={dia:null,hora:null};guardar();ir('horario');return}
 if(t.closest('[data-continuar-horario]')){if(S.reserva.hora==null){document.getElementById('h-err').innerHTML=`<p class="msg-error" role="alert">${ic('alert',18)}Elige una hora con cupo para continuar.</p>`;const r=document.querySelector('[name=hora]');(r||document.querySelector('[name=dia]:checked')).focus();return}ir('confirmar');return}
 const rep=t.closest('[data-reprogramar]');if(rep){const r=S.reservas.find(x=>x.id===rep.dataset.reprogramar);S.animal=r.animal;S.ver=r.animal;S.origen='explorar';S.reprogramando=r.id;S.reserva={dia:r.dia,hora:null};guardar();ir('horario');return}
 const can=t.closest('[data-cancelar]');if(can)return cancelar(can.dataset.cancelar);
});

function render(foco=true){
 const r=ruta();
 if(['sistema','tablero','movil','proyecto'].includes(r)){return renderDoc(r)}
 document.getElementById('docroot').innerHTML='';document.body.classList.remove('vista-movil');document.getElementById('app').hidden=false;document.getElementById('skip').hidden=false;
 const vista=(V[r]||V.bienvenida)();
 document.body.classList.toggle('en-flujo',!!vista.enFlujo);
 document.body.classList.toggle('sin-nav',!!vista.sinNav);
 document.getElementById('tabbar').hidden=!!(vista.enFlujo||vista.sinNav);
 pintarNav(r);cabecera(vista);
 document.getElementById('main').innerHTML=vista.html;
 document.title=`${vista.titulo} · Huella`;
 if(vista.despues)vista.despues();
 if(foco){window.scrollTo(0,0);enfocarTitulo();anunciar(vista.titulo)}
}
document.getElementById('skip').addEventListener('click',e=>{e.preventDefault();const m=document.getElementById('main');m.focus();m.scrollIntoView()});
window.addEventListener('hashchange',()=>{if(dlg.open)dlg.close();token++;render()});
aplicarTexto();
</script>
<script>
/* =========================================================

function navDoc(r){return `<nav class="doc-nav" aria-label="Documentación"><div class="in"><span class="marca"><span style="color:var(--c-acento)">${ic('paw',26)}</span>Huella</span><a href="#proyecto" ${r==='proyecto'?'aria-current="page"':''}>Proyecto</a><a href="#bienvenida">Prototipo</a><a href="#movil" ${r==='movil'?'aria-current="page"':''}>Vista celular</a><a href="#tablero" ${r==='tablero'?'aria-current="page"':''}>Tablero de mockups</a><a href="#sistema" ${r==='sistema'?'aria-current="page"':''}>Sistema de diseño</a></div></nav>`}
function renderDoc(r){
 document.getElementById('app').hidden=true;document.getElementById('tabbar').hidden=true;document.getElementById('skip').hidden=true;
 document.body.classList.remove('en-flujo','sin-nav');document.body.classList.toggle('vista-movil',r==='movil');
 const root=document.getElementById('docroot');
 root.innerHTML=navDoc(r)+({sistema:docSistema,tablero:docTablero,movil:docMovil,proyecto:docProyecto}[r])();
 document.title=({sistema:'Sistema de diseño',tablero:'Tablero de mockups',movil:'Vista celular',proyecto:'Proyecto'}[r])+' · Huella';
 window.scrollTo(0,0);const h=root.querySelector('h1');h.setAttribute('tabindex','-1');h.focus();
}
const SW=[
 ['Bosque','--c-bosque','#23302B','Texto principal, navegación activa, chips seleccionados',true],
 ['Crema','--c-crema','#FAF6EF','Fondo general de la app'],
 ['Arena','--c-arena','#F3ECE1','Fondos sutiles, etiquetas informativas'],
 ['Superficie','--c-superficie','#FFFFFF','Tarjetas, campos, diálogos'],
 ['Terracota (acción)','--c-primario','#B5482A','Acción principal: botones, franja elegida. Blanco encima 5,35:1',true],
 ['Terracota vivo (decorativo)','--c-acento','#D9653B','Solo ilustración y marca. No usar con texto blanco (3,57:1)',true],
 ['Texto secundario','--c-texto-2','#5A625D','Ayudas, metadatos. 5,84:1 sobre crema',true],
 ['Borde de control','--c-borde-control','#8C938F','Bordes de campos y chips (3,14:1, ≥3:1)',true],
 ['Éxito','--c-exito','#2F6B4F','Confirmaciones, cupos disponibles',true],
 ['Error','--c-error','#A3271B','Errores de formulario y de conexión',true],
 ['Aviso','--c-aviso','#7A4E00','Último cupo, sin cupo, guía obligatoria',true],
 ['Info / foco','--c-info','#235380','Mensajes informativos y anillo de foco',true]];
function docSistema(){
 const btns=`<div class="var" data-l="Primario">${C.boton('Elegir horario',{icono:'calendar'})}</div><div class="var" data-l="Secundario">${C.boton('Ver otro',{tipo:'secundario',icono:'refresh'})}</div><div class="var" data-l="Texto">${C.boton('Ver mis encuentros',{tipo:'texto'})}</div><div class="var" data-l="Peligro">${C.boton('Sí, cancelar',{tipo:'peligro',icono:'trash'})}</div><div class="var" data-l="Cargando"><button class="btn btn-primario" aria-busy="true" type="button"><span class="spinner" aria-hidden="true"></span><span>Confirmando…</span></button></div><div class="var" data-l="Deshabilitado">${C.boton('No disponible',{attrs:'disabled'})}</div><div class="var" data-l="Ayuda (fijo)">${BTN_AYUDA.replace('data-ayuda','data-ayuda')}</div>`;
 const toby=byId('toby');
 return `<main class="doc" id="doc-main">
 <p class="t-overline">Actividad 5 · Diseño visual</p><h1 style="font-size:2.25rem;margin-top:6px">Sistema de diseño de Huella</h1>
 <p class="t-muted" style="max-width:70ch;margin-top:8px">Lenguaje visual cálido y tranquilo para personas con estrés o ansiedad: pocos colores con funciones claras, una sola tipografía (Nunito) en dos pesos, texto legible de 16 px y componentes grandes y fáciles de tocar. Todo lo que se ve aquí es el mismo código que usa el prototipo.</p>
 <section aria-labelledby="s-color"><h2 id="s-color">1. Color</h2><p class="t-muted">Paleta limitada: neutros cálidos + un color de acción + cuatro colores de estado. Los estados siempre se acompañan de ícono y texto (nunca solo color).</p>
  <div class="swatches" style="margin-top:16px">${SW.map(([n,v,h,u,osc])=>`<div class="swatch"><div class="m" style="background:${h}" aria-hidden="true"></div><div class="i"><strong>${n}</strong><br><code>${h}</code> · <code>${v}</code><br><span class="t-muted">${u}</span></div></div>`).join('')}</div></section>
 <section aria-labelledby="s-tipo"><h2 id="s-tipo">2. Tipografía</h2><p class="t-muted">Una sola familia: Nunito (redondeada y muy legible). Títulos en peso 800, texto en 400 y etiquetas en 700. Texto base 16 px; 13–14 px solo en metadatos.</p>
  <div class="tabla-wrap" role="region" aria-label="Tabla de estilos tipográficos" tabindex="0"><table class="tabla"><thead><tr><th scope="col">Estilo</th><th scope="col">Muestra</th><th scope="col">Especificación</th><th scope="col">Uso</th></tr></thead><tbody>
  <tr><td>Display</td><td><span class="t-display">Huella</span></td><td>Nunito 800 · 32–44 px</td><td>Marca, portada</td></tr>
  <tr><td>Título 1</td><td><span class="t-h1" style="font-family:var(--f-display);font-weight:800">Hola, Laura</span></td><td>Nunito 800 · 24 px (28 en escritorio)</td><td>Un título por pantalla</td></tr>
  <tr><td>Título 2</td><td><span class="t-h2" style="font-family:var(--f-display);font-weight:800">Próximo encuentro</span></td><td>Nunito 800 · 18 px</td><td>Secciones y tarjetas</td></tr>
  <tr><td>Texto</td><td>Te sugerimos un compañero.</td><td>Nunito 400 · 16/24</td><td>Párrafos, descripciones</td></tr>
  <tr><td>Etiqueta</td><td><span class="t-label">Correo electrónico</span></td><td>Nunito 700 · 15–16</td><td>Campos, botones (800)</td></tr>
  <tr><td>Ayuda / meta</td><td><span class="t-small t-muted">Lo usamos para enviarte la confirmación.</span></td><td>Nunito 400 · 14/20 · gris 5A625D</td><td>Ayudas, metadatos</td></tr>
  <tr><td>Sobretítulo</td><td><span class="t-overline">Sugerencia 1 de 4</span></td><td>Nunito 700 · 14 · gris</td><td>Contexto sobre el título</td></tr></tbody></table></div></section>
 <section aria-labelledby="s-esp"><h2 id="s-esp">3. Espaciado y alineación</h2><p class="t-muted">Escala de 4 px: 4 · 8 · 12 · 16 · 24 · 32 · 48. Márgenes de pantalla 16 px (móvil) y 32 px (escritorio). Dentro de una tarjeta 16–24 px; entre secciones 24 px. Todo alineado a la izquierda (salvo estados vacíos y éxito), una sola columna en móvil y dos columnas a partir de 1024 px.</p>
  <div class="row wrap" style="margin-top:16px;align-items:flex-end">${[4,8,12,16,24,32,48].map(n=>`<div style="text-align:center"><div style="width:${n}px;height:${n}px;background:var(--c-primario);border-radius:2px;margin:0 auto"></div><span class="t-small">${n}</span></div>`).join('')}</div></section>
 <section aria-labelledby="s-forma"><h2 id="s-forma">4. Forma y tratamiento visual</h2>
  <div class="row wrap" style="margin-top:12px;gap:24px">${[['8 px','chips pequeños',8],['12 px','botones, campos, tarjetas',12],['Píldora','chips y etiquetas',999]].map(([n,u,r])=>`<div><div style="width:96px;height:64px;border:2px solid var(--c-bosque);border-radius:${r}px;background:#fff"></div><p class="t-small"><strong>${n}</strong><br>${u}</p></div>`).join('')}
  <div><div style="width:96px;height:64px;border-radius:12px;background:#fff;border:1px solid var(--c-borde)"></div><p class="t-small"><strong>Borde 1 px</strong><br>tarjetas (sin sombra)</p></div></div>
  <h3 style="margin-top:20px">Iconografía</h3><p class="t-muted">Línea de 2 px, extremos redondeados, cuadrícula de 24 px. Siempre con texto visible o etiqueta accesible.</p>
  <div class="row wrap" style="margin-top:10px;gap:14px">${['home','compass','calendar','paw','plus','help','user','clock','pin','check','alert','info','phone','heart','lock','shield','users','book','bell','sparkle','walk','refresh'].map(n=>`<span title="${n}" style="display:inline-flex;flex-direction:column;align-items:center;font-size:.6875rem;color:var(--c-texto-2);gap:2px"><span style="color:var(--c-bosque)">${ic(n,26)}</span>${n}</span>`).join('')}</div>
  <h3 style="margin-top:20px">Ilustración</h3><p class="t-muted">Retratos planos y sencillos de cada animal, usados como marcador de la foto real que tendrá la versión final.</p>
  <div class="row wrap" style="margin-top:10px">${ANIMALES.map(a=>mascota(a,72)).join('')}</div></section>
 <section aria-labelledby="s-comp"><h2 id="s-comp">5. Biblioteca de componentes</h2><p class="t-muted">13 componentes reutilizables. Cada uno es una función o clase CSS única que usan todas las pantallas.</p>
  ${comp('C1 · Botón','Una acción principal por pantalla (terracota). La secundaria va con borde; las terciarias como texto. «Peligro» solo para acciones destructivas confirmadas. Altura mínima 48 px.',btns)}
  ${comp('C2 · Campo de texto','Etiqueta siempre visible arriba, ayuda opcional y mensaje de error con ícono que dice cómo corregir.',`<div class="var" style="min-width:min(240px,100%)" data-l="Normal"><div class="campo"><label for="d1">Nombre</label><input class="input" id="d1" value="Laura"></div></div><div class="var" style="min-width:min(240px,100%)" data-l="Con error"><div class="campo"><label for="d2">Correo electrónico</label><input class="input" id="d2" value="laura@" aria-invalid="true" aria-describedby="d2e"><p class="msg-error" id="d2e">${ic('alert',18)}Revisa el correo: debe tener la forma nombre@dominio.com.</p></div></div>`)}
  ${comp('C3 · Selector de ánimo','Escala 1–5 con cara, número y palabra: no depende del color. Radio nativo, se maneja con flechas del teclado.',`<div style="flex:1;min-width:min(280px,100%)"><div class="animo">${[1,2,3,4,5].map(m=>`<label><input type="radio" name="dm" ${m===2?'checked':''}>${cara(m)}<span class="num">${m}</span><span>${ANIMOS[m-1]}</span></label>`).join('')}</div></div>`)}
  ${comp('C4 · Chip seleccionable y etiqueta','El chip (con borde) se puede elegir: causas del ánimo, preferencias. La etiqueta (sin borde) solo informa: temperamento. Seleccionado = fondo bosque + ✓.',`<div class="var" data-l="Chip"><div class="chips"><label class="chip-sel"><input type="checkbox" checked><span>${ic('check',16,'','chk')}Soledad</span></label><label class="chip-sel"><input type="checkbox"><span>${ic('check',16,'','chk')}Sueño</span></label></div></div><div class="var" data-l="Etiqueta"><div class="chips">${C.tag('Tranquilo')}${C.tag('Pequeño')}</div></div><div class="var" data-l="Insignia"><div class="chips"><span class="badge badge-exito">${ic('check',14)}Confirmado</span><span class="badge badge-aviso">${ic('info',14)}Obligatoria</span><span class="badge badge-info">${ic('lock',14)}Privado</span></div></div>`)}
  ${comp('C5 · Tarjeta de animal','Retrato, nombre, edad, refugio, distancia y dos rasgos. Toda la tarjeta es un botón que abre la ficha.',`<div style="flex:1;min-width:min(280px,100%);max-width:420px">${C.tarjetaAnimal(toby)}</div>`)}
  ${comp('C6 · Tarjeta de encuentro','Resume una reserva. Variante con acciones (Encuentros) y sin acciones (Inicio, confirmación).',`<div style="flex:1;min-width:min(280px,100%);max-width:480px">${C.tarjetaEncuentro({id:'demo',animal:'toby',dia:2,hora:1,tipo:'paseo'})}</div>`)}
  ${comp('C7 · Franja horaria','Disponible (verde «3 cupos»), último cupo (ámbar), seleccionada (terracota + ✓) y sin cupo (tachada y punteada; al tocarla propone alternativas).',`<div class="franjas" style="flex:1;min-width:min(280px,100%)"><label class="franja"><input type="radio" name="fx"><span class="caja"><span class="hora">9:00 a. m.</span><span class="cupo">3 cupos</span></span></label><label class="franja"><input type="radio" name="fx"><span class="caja"><span class="hora">10:30 a. m.</span><span class="cupo ultimo">Último cupo</span></span></label><label class="franja"><input type="radio" name="fx" checked><span class="caja"><span class="hora">3:00 p. m.</span><span class="cupo">2 cupos</span></span></label><button type="button" class="franja-llena"><span class="hora">4:30 p. m.</span><span class="cupo">Sin cupo</span></button></div>`)}
  ${comp('C8 · Indicador de pasos','Texto «Paso n de 4» + barra segmentada. Muestra que reservar es corto (decisión de la Actividad 4).',`<div style="flex:1;min-width:min(260px,100%);max-width:360px">${C.pasos(2,4,'Tu match')}</div>`)}
  ${comp('C9 · Navegación principal','Móvil: barra inferior de 4 pestañas + botón central «Match». Escritorio: barra lateral con las mismas secciones. Pestaña activa: color + subrayado (no solo color).',`<div style="flex:1;min-width:min(300px,100%);max-width:420px;position:relative"><nav aria-label="Ejemplo de barra inferior" style="background:#fff;border:1px solid var(--c-borde);border-radius:16px;padding-top:24px"><ul style="display:grid;grid-template-columns:repeat(5,1fr);list-style:none;margin:0;padding:6px 4px">${TABS.map(([rr,l,i],k)=>rr==='checkin'?`<li><span class="tab tab-match"><span class="fab">${ic('plus',28)}</span><span class="lbl">Match</span></span></li>`:`<li><span class="tab" ${k===0?'aria-current="page"':''}>${ic(i,24)}<span class="lbl">${l}</span></span></li>`).join('')}</ul></nav></div>`)}
  ${comp('C10 · Encabezado con Ayuda','Ayuda fija arriba a la derecha en todas las pantallas, separada de la barra inferior para no tocarla por error.',`<div style="flex:1;min-width:min(300px,100%);max-width:420px;background:var(--c-crema);border:1px solid var(--c-borde);border-radius:12px"><div class="topbar-in"><span class="avatar-btn" style="display:flex;align-items:center;justify-content:center">L</span><span class="titulo" style="flex:1;text-align:center;font-family:var(--f-display);font-weight:800">Inicio</span>${BTN_AYUDA}</div></div>`)}
  ${comp('C11 · Mensaje de estado','Info, éxito, error y aviso: borde lateral, ícono y título en texto. El error usa role="alert".',`<div class="stack-sm" style="flex:1;min-width:min(280px,100%)">${C.alerta('info','Privacidad por defecto','Tu ánimo solo lo ves tú.')}${C.alerta('exito','Reserva confirmada','')}${C.alerta('error','No pudimos confirmar tu reserva','Revisa tu conexión y toca «Reintentar».')}${C.alerta('aviso','Esta franja ya está llena','Te proponemos otras cercanas.')}</div>`)}
  ${comp('C12 · Estado vacío y carga','Vacío: ícono, título, explicación y una acción para salir. Carga: indicador giratorio con texto de estado.',`<div style="flex:1;min-width:min(240px,100%)">${C.vacio('Todavía no tienes encuentros','Cuando reserves aparecerá aquí.',C.boton('Buscar mi match',{icono:'plus',sm:true}),'calendar')}</div><div style="flex:1;min-width:min(200px,100%)"><div class="cargando"><span class="spinner oscuro" aria-hidden="true"></span><span>Cargando sugerencia…</span></div></div>`)}
  ${comp('C13 · Interruptor y diálogo','Interruptor para ajustes binarios (texto grande, recordatorios). Diálogo modal para ayuda, guía y confirmaciones destructivas; se cierra con Esc.',`<div style="flex:1;min-width:min(260px,100%);background:#fff;border-radius:12px;padding:8px 16px"><label class="switch"><span><strong>Texto grande</strong></span><input type="checkbox" role="switch" checked></label><label class="switch"><span><strong>Recordatorios</strong></span><input type="checkbox" role="switch"></label></div><div>${C.boton('Abrir diálogo de ayuda',{tipo:'secundario',icono:'help',attrs:'data-ayuda'})}</div>`)}
 </section></main>`;}

function docMovil(){return `<main class="doc" id="doc-main"><h1 style="font-size:1.75rem">Vista celular</h1>

function docProyecto(){const tarjeta=(h,t,d,b)=>`<a class="card hub" href="#${h}"><h2>${t}</h2><p class="t-muted" style="margin-top:6px">${d}</p><span class="btn btn-${b} btn-sm" style="margin-top:12px">Abrir</span></a>`;
 return `<main class="doc" id="doc-main"><p class="t-overline">Diseño de Interfaces de Usuario · Universidad Antonio Nariño · 2026</p>
 <h1 style="font-size:2rem;margin-top:6px">Huella · Prototipo y diseño visual</h1>
 <p style="max-width:72ch;margin-top:10px">Huella es una aplicación de bienestar emocional a través de encuentros con animales de refugio. Aquí están los resultados de la <strong>Guía 5</strong> (mockups, estilos visuales y biblioteca de componentes) y de la <strong>Guía 6</strong> (prototipo navegable, estados, diseño responsive y accesibilidad). Autora: July Tatiana Ariza Peña.</p>
 <div class="hubs">${tarjeta('bienvenida','Prototipo navegable','Recorre la tarea prioritaria: reservar un paseo según tu ánimo del día. Se adapta a celular y a computador.','primario')}
 ${tarjeta('movil','Vista celular','El prototipo en un marco de teléfono (390 × 844 px), para revisarlo desde un computador.','secundario')}
 ${tarjeta('tablero','Tablero de mockups','Todas las pantallas del flujo en móvil y escritorio.','secundario')}
 ${tarjeta('sistema','Sistema de diseño','Colores, tipografía, espaciado, forma y los 13 componentes reutilizables.','secundario')}</div>
 <section><h2>Cómo revisar el prototipo</h2><ol class="stack-sm" style="padding-left:20px;max-width:72ch;margin-top:8px">
 <li>Abre el prototipo y toca «Ya tengo cuenta» (o crea una cuenta para ver la validación del registro).</li>
 <li>En Inicio toca «Hacer check-in», elige cómo te sientes y algunas causas, y toca «Ver mi match».</li>
 <li>Toca «Elegir horario», selecciona una franja (el sábado no tiene cupos y propone alternativas), lee la guía y confirma.</li>
 <li>Para ver otros estados usa el botón «Controles del prototipo»: fallo de conexión, sin animales disponibles o primer encuentro. Ese botón no forma parte del producto.</li>
 <li>Para ver la rama de apoyo, elige el ánimo 1 en el check-in.</li></ol>
 <p class="t-small t-muted" style="margin-top:12px">Los animales, los refugios y los cupos son datos ficticios. El prototipo no tiene backend: las respuestas se simulan en el navegador.</p></section>
 <section aria-labelledby="h-docs"><h2 id="h-docs">Documentos de la entrega</h2><ul class="stack-sm" style="padding-left:20px;margin-top:8px">
 <li><a href="documentos/Actividad5_Huella_Ariza.pdf">Informe Actividad 5 · Diseño visual, mockups y sistema de diseño (PDF)</a></li>
 <li><a href="documentos/Actividad6_Huella_Ariza.pdf">Informe Actividad 6 · Prototipado interactivo, responsive y accesibilidad (PDF)</a></li>
 <li><a href="documentos/Presentacion_Huella_Guias5y6.pdf">Presentación de las guías 5 y 6 (PDF)</a></li>
 <li><a href="documentos/Guion_Presentacion_Huella.pdf">Guion de la presentación (PDF)</a></li>
 <li><a href="https://github.com/JulyTAriza/Proyectos-UAN/tree/gh-pages/huella">Repositorio con el código fuente (archivo editable)</a></li></ul></section></main>`}
function comp(n,u,demo){return `<article class="comp" aria-label="${n}"><div><h3>${n}</h3><p class="t-small t-muted" style="margin-top:6px">${u}</p></div><div class="demo">${demo}</div></article>`}
const MOCKS=[['01-bienvenida','Bienvenida'],['02-registro-error','Registro con validación'],['03-inicio-vacio','Inicio (sin encuentros)'],['04-checkin','Check-in de ánimo · paso 1'],['05-apoyo','Ánimo 1: apoyo profesional'],['06-match-carga','Match · cargando'],['07-match','Match sugerido · paso 2'],['08-horario','Horario · paso 3'],['09-sin-cupo','Franja sin cupo → alternativas'],['10-confirmar','Confirmar + guía · paso 4'],['11-error-red','Error de conexión'],['12-listo','Éxito: reserva lista'],['13-inicio-reserva','Inicio con próximo encuentro'],['14-encuentros','Mis encuentros']];
